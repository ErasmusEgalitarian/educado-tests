name: Publicar entrega

# Cria uma release com o PDF de UM relatório, o nomeado na tag.
#
#   git tag entrega-01-estrategia-de-testes        primeira entrega
#   git tag entrega-01-estrategia-de-testes-v2     reentrega, versão 2
#   git push origin <a tag>
#
# O trecho depois de "entrega-" e antes do sufixo "-vN" opcional tem que ser
# o nome da pasta em relatorios/.

on:
  push:
    tags: ['entrega-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identificar o relatório pela tag
        id: alvo
        run: |
          alvo="${GITHUB_REF_NAME#entrega-}"
          # sufixo -vN e versao de reentrega, nao faz parte do nome da pasta
          relatorio="$(printf '%s' "$alvo" | sed -E 's/-v[0-9]+$//')"
          versao="$(printf '%s' "$alvo" | sed -nE 's/.*-v([0-9]+)$/\1/p')"
          echo "versao=${versao:-1}" >> "$GITHUB_OUTPUT"
          if [ ! -f "relatorios/$relatorio/main.tex" ]; then
            echo "::error::A tag aponta para 'relatorios/$relatorio', que não existe."
            echo "Relatórios disponíveis:"
            find relatorios -mindepth 1 -maxdepth 1 -type d -printf '  %f\n'
            exit 1
          fi
          echo "relatorio=$relatorio" >> "$GITHUB_OUTPUT"

      - name: Compilar
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: relatorios/${{ steps.alvo.outputs.relatorio }}
          root_file: main.tex
          args: -pdf -outdir=build -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Nomear o PDF conforme entrega.txt
        id: pdf
        run: |
          dir="relatorios/${{ steps.alvo.outputs.relatorio }}"
          nome="${{ steps.alvo.outputs.relatorio }}"
          [ -f "$dir/entrega.txt" ] && nome="$(head -1 "$dir/entrega.txt")"
          cp "$dir/build/main.pdf" "$nome.pdf"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - name: Criar release com o PDF
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ steps.pdf.outputs.nome }} (v${{ steps.alvo.outputs.versao }})
          files: ${{ steps.pdf.outputs.nome }}.pdf
          generate_release_notes: true
