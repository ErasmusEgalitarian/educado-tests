name: Publicar entrega

# Cria uma release com o PDF de UM relatório, o nomeado na tag.
# Ex.: git tag entrega-01-estrategia-de-testes && git push origin --tags
# O trecho depois de "entrega-" tem que ser o nome da pasta em relatorios/.

on:
  push:
    tags: ['entrega-*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Identificar o relatório pela tag
        id: alvo
        run: |
          relatorio="${GITHUB_REF_NAME#entrega-}"
          if [ ! -f "relatorios/$relatorio/main.tex" ]; then
            echo "::error::A tag aponta para 'relatorios/$relatorio', que não existe."
            echo "Relatórios disponíveis:"
            find relatorios -mindepth 1 -maxdepth 1 -type d -printf '  %f\n'
            exit 1
          fi
          echo "relatorio=$relatorio" >> "$GITHUB_OUTPUT"

      - name: Compilar
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: relatorios/${{ steps.alvo.outputs.relatorio }}
          root_file: main.tex
          args: -pdf -outdir=build -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Nomear o PDF conforme entrega.txt
        id: pdf
        run: |
          dir="relatorios/${{ steps.alvo.outputs.relatorio }}"
          nome="${{ steps.alvo.outputs.relatorio }}"
          [ -f "$dir/entrega.txt" ] && nome="$(head -1 "$dir/entrega.txt")"
          cp "$dir/build/main.pdf" "$nome.pdf"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - name: Criar release com o PDF
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ steps.pdf.outputs.nome }}.pdf
          generate_release_notes: true
