name: Compilar relatórios

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Descobre as pastas em relatorios/ e monta a matrix.
  # Relatório novo entra no CI sozinho, sem editar este arquivo.
  descobrir:
    name: Descobrir relatórios
    runs-on: ubuntu-latest
    outputs:
      relatorios: ${{ steps.lista.outputs.relatorios }}
    steps:
      - uses: actions/checkout@v4
      - id: lista
        run: |
          lista=$(find relatorios -mindepth 1 -maxdepth 1 -type d -printf '%f\n' \
                  | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "relatorios=$lista" >> "$GITHUB_OUTPUT"
          echo "Encontrados: $lista"

  build:
    name: ${{ matrix.relatorio }}
    needs: descobrir
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        relatorio: ${{ fromJson(needs.descobrir.outputs.relatorios) }}
    steps:
      - uses: actions/checkout@v4

      - name: Compilar
        uses: xu-cheng/latex-action@v3
        with:
          working_directory: relatorios/${{ matrix.relatorio }}
          root_file: main.tex
          args: -pdf -outdir=build -interaction=nonstopmode -halt-on-error -file-line-error

      - name: Nomear o PDF conforme entrega.txt
        id: pdf
        # build/ e criado pelo container da action como root: mv falharia ao
        # remover a origem, entao copiamos em vez de mover.
        run: |
          dir="relatorios/${{ matrix.relatorio }}"
          nome="${{ matrix.relatorio }}"
          [ -f "$dir/entrega.txt" ] && nome="$(head -1 "$dir/entrega.txt")"
          cp "$dir/build/main.pdf" "$nome.pdf"
          echo "nome=$nome" >> "$GITHUB_OUTPUT"

      - name: Publicar PDF como artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.pdf.outputs.nome }}
          path: ${{ steps.pdf.outputs.nome }}.pdf
          if-no-files-found: error
          retention-days: 30
